server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url =jdbc:mysql://localhost:3306/gpr_sicma?useSSL=false&serverTimezone=Africa/Porto-Novo&useUnicode=true&characterEncoding=UTF-8

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## Flyway — limité au module WhatGPR (tables wgpr_*) uniquement.
## Le reste de l'application continue avec ddl-auto=update ci-dessus, inchangé.
## Table d'historique et dossier de migrations dédiés pour ne rien mélanger avec
## une éventuelle adoption de Flyway plus tard pour le reste de l'appli.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/whatgpr
spring.flyway.table=flyway_schema_history_whatgpr
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=whatgpr_baseline

## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size.
spring.servlet.multipart.max-file-size=200MB
# Max Request Size
spring.servlet.multipart.max-request-size=250MB

## File Storage Properties
# All files uploaded through the REST API will be stored in this directory
# file.upload-dir=/Users/Dell/uploads-gps
spring.web.resources.add-mappings=true

## Limite taille requête HTTP (pour les payloads JSON audio base64)
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800

## WhatGPR — URL interne du microservice WhatsApp Node.js
whatgpr.node.url=http://localhost:3001
# Secret partagé avec le microservice Node (whatsapp-service/.env → INTERNAL_SECRET).
# Obligatoire — doit être défini via la variable d'environnement WHATGPR_INTERNAL_SECRET
# (pas de valeur de repli committée ici : l'appli doit refuser de démarrer si absente).
whatgpr.internal.secret=${WHATGPR_INTERNAL_SECRET}

## Superset config
superset.url=http://localhost:8088
superset.admin.username=admin
superset.admin.password=admin