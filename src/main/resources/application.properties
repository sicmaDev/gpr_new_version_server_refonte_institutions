server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url =jdbc:mysql://localhost:3306/gpr_sicma?useSSL=false&serverTimezone=Africa/Porto-Novo&useUnicode=true&characterEncoding=UTF-8

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size. Plafond global (filet de sécurité) ; les règles métier précises
# (nombre de fichiers/audios, taille par type, taille cumulée) sont appliquées
# dans ClaimController.validateAttachments() pour l'enregistrement des réclamations.
spring.servlet.multipart.max-file-size=25MB
# Max Request Size
spring.servlet.multipart.max-request-size=110MB

## File Storage Properties
# All files uploaded through the REST API will be stored in this directory
# file.upload-dir=/Users/Dell/uploads-gps
spring.web.resources.add-mappings=true

## Superset config
superset.url=http://localhost:8088
superset.admin.username=admin
superset.admin.password=admin

## Module WhatsApp (WhatGPR) — pont vers le microservice Node (Baileys)
# URL du microservice Node whatsapp-service
whatsapp.node.url=http://localhost:3001
# Secret partagé avec le microservice Node (header X-WhatGPR-Secret sur les appels
# entrants /api/whatgpr/internal/**). OBLIGATOIRE : doit être fourni via la variable
# d'environnement WHATSAPP_INTERNAL_SECRET, sans valeur de repli committée ici.
whatsapp.internal.secret=${WHATSAPP_INTERNAL_SECRET}