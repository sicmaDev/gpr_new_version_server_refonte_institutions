server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url =jdbc:mysql://localhost:3306/gpr_sicma?useSSL=false&serverTimezone=Africa/Porto-Novo&useUnicode=true&characterEncoding=UTF-8

spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## Flyway — limité au module WhatGPR (tables wgpr_*) uniquement.
## Le reste de l'application continue avec ddl-auto=update ci-dessus, inchangé.
## Table d'historique et dossier de migrations dédiés pour ne rien mélanger avec
## une éventuelle adoption de Flyway plus tard pour le reste de l'appli.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration/whatgpr
spring.flyway.table=flyway_schema_history_whatgpr
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=whatgpr_baseline

## MULTIPART (MultipartProperties)
# Enable multipart uploads
spring.servlet.multipart.enabled=true
# Threshold after which files are written to disk.
spring.servlet.multipart.file-size-threshold=2KB
# Max file size. Plafond global (filet de sécurité) ; les règles métier précises
# (nombre de fichiers/audios, taille par type, taille cumulée) sont appliquées
# dans ClaimController.validateAttachments() pour l'enregistrement des réclamations.
spring.servlet.multipart.max-file-size=25MB
# Max Request Size
spring.servlet.multipart.max-request-size=110MB

## File Storage Properties
# All files uploaded through the REST API will be stored in this directory
# file.upload-dir=/Users/Dell/uploads-gps
spring.web.resources.add-mappings=true

## Limite taille requête HTTP (pour les payloads JSON audio base64)
server.tomcat.max-http-form-post-size=52428800
server.tomcat.max-swallow-size=52428800

## WhatGPR — URL interne du microservice WhatsApp Node.js
whatgpr.node.url=http://localhost:3001
# Secret partagé avec le microservice Node (whatsapp-service/.env → INTERNAL_SECRET).
# Obligatoire — doit être défini via la variable d'environnement WHATGPR_INTERNAL_SECRET
# (pas de valeur de repli committée ici : l'appli doit refuser de démarrer si absente).
whatgpr.internal.secret=${WHATGPR_INTERNAL_SECRET}

## Superset config
superset.url=http://localhost:8088
superset.admin.username=admin
# Facultatif (Superset n'est plus utilisé, remplacé à terme par Power BI).
superset.admin.password=${SUPERSET_ADMIN_PASSWORD:}

## Module WhatsApp (WhatGPR) — pont vers le microservice Node (Baileys)
# URL du microservice Node whatsapp-service
# Corrigé : WgprController.java lit whatgpr.node.url / whatgpr.internal.secret
# (préfixe "whatgpr", pas "whatsapp") — les anciennes clés whatsapp.* n'étaient
# jamais lues par le code, donc sans effet.
whatgpr.node.url=http://localhost:3001
# Secret partagé avec le microservice Node (header X-WhatGPR-Secret sur les appels
# entrants /api/whatgpr/internal/**). OBLIGATOIRE : doit être fourni via la variable
# d'environnement WHATGPR_INTERNAL_SECRET, sans valeur de repli committée ici.
whatgpr.internal.secret=${WHATGPR_INTERNAL_SECRET}

## Chiffrement des données sensibles (AES-256-GCM + HMAC-SHA256)
# Clés Base64 de 32 octets, différentes, fournies UNIQUEMENT par variables d'environnement.
# L'application refuse de démarrer si une clé est absente ou invalide.
gpr.crypto.key=${GPR_ENCRYPTION_KEY}
gpr.crypto.hmac-key=${GPR_HMAC_KEY}
# Chiffrer les données déjà en base au démarrage (false par défaut).
# À activer UNE SEULE FOIS (GPR_ENCRYPT_EXISTING=true) après sauvegarde, puis remettre à false.
gpr.crypto.migrate-existing=${GPR_ENCRYPT_EXISTING:false}

## Clé de signature des jetons de connexion (JWT, HS256)
# Base64, au moins 32 octets (ex : openssl rand -base64 64), fournie UNIQUEMENT par variable d'environnement.
# Changer cette clé déconnecte tous les utilisateurs (une fois). L'application refuse de démarrer sans elle.
gpr.jwt.secret=${GPR_JWT_SECRET}

## Chiffrement des fichiers existants (pièces jointes, audios) au démarrage : non (défaut) | copie | remplacer
# copie : versions chiffrées écrites dans <dossier>_chiffre, originaux intacts (pour validation).
# remplacer : chiffre les originaux sur place (après validation ET sauvegarde des dossiers), puis remettre à non.
gpr.crypto.migrate-files=${GPR_ENCRYPT_FILES:non}
